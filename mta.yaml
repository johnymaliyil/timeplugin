_schema-version: "3.2"
ID: solar-terminal-plugin
version: 1.0.0
description: Solar shell plugin updating user parameter

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install

modules:
  - name: solar-terminal-plugin-content
    type: com.sap.application.content
    path: .
    requires:
      - name: solar-terminal-plugin-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - comsolarterminalplugin.zip
          name: comsolarterminalplugin
          target-path: resources/

  - name: comsolarterminalplugin
    type: html5
    path: .
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms: []

  # Destinations that let SAP Build Work Zone (managed approuter) discover
  # the plugin in the HTML5 repo; sap.cloud.service must match manifest.json
  - name: solar-terminal-plugin-destination-content
    type: com.sap.application.content
    requires:
      - name: solar-terminal-plugin-destination
        parameters:
          content-target: true
      - name: solar-terminal-plugin-repo-host
        parameters:
          service-key:
            name: solar-terminal-plugin-repo-host-key
      - name: solar-terminal-plugin-uaa
        parameters:
          service-key:
            name: solar-terminal-plugin-uaa-key
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: solar-terminal-plugin-html5-repository
              ServiceInstanceName: solar-terminal-plugin-repo-host
              ServiceKeyName: solar-terminal-plugin-repo-host-key
              sap.cloud.service: com.solar.terminalplugin.service
            - Name: solar-terminal-plugin-uaa
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: solar-terminal-plugin-uaa
              ServiceKeyName: solar-terminal-plugin-uaa-key
              sap.cloud.service: com.solar.terminalplugin.service
    build-parameters:
      no-source: true

resources:
  - name: solar-terminal-plugin-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
      service-keys:
        - name: solar-terminal-plugin-repo-host-key

  - name: solar-terminal-plugin-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  - name: solar-terminal-plugin-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0
